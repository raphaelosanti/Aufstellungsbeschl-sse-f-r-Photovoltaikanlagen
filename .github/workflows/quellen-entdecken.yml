name: Quellen entdecken

on:
  schedule:
    - cron: "0 3 * * 0"          # sonntags; jeder Lauf arbeitet das nächste Stück ab
  workflow_dispatch:
    inputs:
      land:
        description: "Bundesländer (Leerzeichen) oder 'alle'"
        default: "alle"
      budget:
        description: "Max. neu geprüfte Gemeinden pro Lauf (0 = alle)"
        default: "400"

permissions:
  contents: write

concurrency:
  group: quellen-entdecken
  cancel-in-progress: false

jobs:
  entdecken:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache_pv
          key: quellen-cache-${{ github.run_id }}
          restore-keys: quellen-cache-
      - name: Quellen entdecken (setzt auf dem Stand im Repo auf)
        env:
          PV_KONTAKT: ${{ vars.PV_KONTAKT }}
        run: |
          python quellen_entdecken.py \
            --land ${{ inputs.land || 'alle' }} \
            --budget ${{ inputs.budget || '400' }}
      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add quellen_alle.csv daten/gemeinden.csv
          git commit -m "Quellen/Gemeindetabelle aktualisiert" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
