name: PV-Beschlussregister

on:
  schedule:
    - cron: "43 6 * * *"         # täglich (nach der Quellensuche)
  workflow_dispatch:
    inputs:
      seit:
        description: "Nur Vorlagen ab Datum (YYYY-MM-DD), gilt für den ersten Lauf je Quelle"
        default: "2022-01-01"
      nur_export:
        description: "Nur zusammenführen (kein Sammeln), nutzt den vorhandenen Bestand in daten/"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pv-register
  cancel-in-progress: false   # läuft noch ein Lauf, wartet der nächste

jobs:
  sammeln:
    if: ${{ github.event.inputs.nur_export != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        land: [Brandenburg, Sachsen-Anhalt, Mecklenburg-Vorpommern, Sachsen, Thüringen, Niedersachsen,
               Schleswig-Holstein, Nordrhein-Westfalen, Hessen, Rheinland-Pfalz, Baden-Württemberg,
               Bayern, Saarland, Berlin, Hamburg, Bremen]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Headless-Browser für JavaScript-Seiten (optional)
        continue-on-error: true
        run: pip install playwright && playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache_pv
          key: pv-cache-${{ matrix.land }}-${{ github.run_id }}
          restore-keys: pv-cache-${{ matrix.land }}-
      - name: Beschlüsse sammeln (nur Neues; Bestand liegt in daten/)
        timeout-minutes: 230
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PV_KONTAKT: ${{ vars.PV_KONTAKT }}
          SEIT: ${{ github.event.inputs.seit || '2022-01-01' }}
        run: |
          LLM=""
          if [ -n "$GEMINI_API_KEY" ]; then LLM="--llm gemini"; fi
          python pv_beschluesse.py --quellen quellen_alle.csv --land "${{ matrix.land }}" \
            --seit "$SEIT" --daten daten --out "/tmp/${{ matrix.land }}.xlsx" --parallel 6 $LLM
      - name: Gemeinden ohne RIS – Bekanntmachungen auf der Homepage (Rest der Laufzeit)
        if: always() && hashFiles('quellen_homepage.csv') != ''
        timeout-minutes: 90
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PV_KONTAKT: ${{ vars.PV_KONTAKT }}
          SEIT: ${{ github.event.inputs.seit || '2022-01-01' }}
        run: |
          LLM=""
          if [ -n "$GEMINI_API_KEY" ]; then LLM="--llm gemini"; fi
          python pv_beschluesse.py --quellen quellen_homepage.csv --land "${{ matrix.land }}" \
            --seit "$SEIT" --daten daten --out "/tmp/${{ matrix.land }}_homepage.xlsx" --parallel 6 $LLM
      - name: Bestand committen
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add daten
          git commit -m "Bestand ${{ matrix.land }}" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 5; done
  zusammenfuehren:
    needs: sammeln
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # neuesten Stand holen, inkl. der Commits der sammeln-Jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ein Dokument aus allen Länderbeständen
        run: python pv_beschluesse.py --nur-export --quellen quellen_alle.csv --daten daten --out PV_Beschluesse_Gesamt.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: PV_Beschluesse_Gesamt_${{ github.run_number }}
          path: PV_Beschluesse_Gesamt.xlsx
          retention-days: 90
      - name: Excel auch im Repo ablegen
        run: |
          mkdir -p ausgabe && cp PV_Beschluesse_Gesamt.xlsx ausgabe/
          python pv_geojson.py ausgabe/PV_Beschluesse_Gesamt.xlsx ausgabe/PV_Beschluesse.geojson
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ausgabe
          git commit -m "Gesamt-Excel aktualisiert" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 5; done
