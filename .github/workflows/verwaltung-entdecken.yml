name: Landkreise, Ämter und Planungsverbände finden

# Legt quellen_verwaltung.csv an (Landkreise, Ämter/Verbandsgemeinden/Verwaltungsgemeinschaften, Regionale
# Planungsverbände aus Wikidata). Das Register liest sie mit dem Homepage-Crawler. Läuft wöchentlich, die Liste ändert sich selten.

on:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verwaltung-entdecken
  cancel-in-progress: false

jobs:
  entdecken:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wikidata abfragen
        env:
          PV_KONTAKT: ${{ vars.PV_KONTAKT }}
        run: python verwaltung_entdecken.py
      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add quellen_verwaltung.csv 2>/dev/null || true
          git commit -m "Quellen: Landkreise, Ämter und Planungsverbände aktualisiert" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 5; done
