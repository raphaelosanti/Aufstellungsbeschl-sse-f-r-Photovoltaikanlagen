name: MaStR-Abgleich

# Zeigt, in welchen Gemeinden Freiflächen-PV im Marktstammdatenregister steht, ohne dass das Register
# einen Beschluss kennt – und warum (kein RIS, ungeprüft, Quelle ohne Treffer ...).

on:
  schedule:
    - cron: "30 4 1 * *"        # monatlich
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt open-mastr
      - name: MaStR-Gesamtdatenexport laden (nur Solar)
        run: |
          python - <<'PY'
          from open_mastr import Mastr
          Mastr().download(method="bulk", data=["solar"])
          PY
      - name: Abgleich
        run: python mastr_abgleich.py --db ~/.open-MaStR/data/sqlite/open-mastr.db
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add entdeckung/mastr_gemeinden.csv entdeckung/mastr_bericht.md
          git commit -m "MaStR-Abgleich aktualisiert" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
