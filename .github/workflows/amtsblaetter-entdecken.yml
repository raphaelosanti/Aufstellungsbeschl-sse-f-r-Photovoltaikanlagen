name: Amtsblätter und Hessen-Verzeichnis finden

# Täglich, nach der Quellensuche. Ergänzt zwei Quellenlisten:
#  - quellen_amtsblatt.csv: Amtsblatt-/Bekanntmachungsseiten der Gemeinden ohne RIS (Adapter pv_amtsblatt.py)
#  - quellen_verzeichnis.csv: Seiten "Bebauungsplan im Verfahren" aus bauleitplanung.hessen.de (Homepage-Crawler)

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Max. Gemeinden pro Lauf für die Amtsblatt-Suche"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: amtsblaetter-entdecken
  cancel-in-progress: false

jobs:
  entdecken:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hessen-Verzeichnis lesen
        continue-on-error: true
        env:
          PV_KONTAKT: ${{ vars.PV_KONTAKT }}
        run: python verzeichnis_hessen.py
      - name: Amtsblatt-Seiten der Gemeinden ohne RIS suchen
        timeout-minutes: 90
        continue-on-error: true
        env:
          PV_KONTAKT: ${{ vars.PV_KONTAKT }}
        run: python amtsblatt_entdecken.py --budget ${{ inputs.budget || '2000' }}
      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add quellen_verzeichnis.csv quellen_amtsblatt.csv daten/amtsblatt_geprueft.json 2>/dev/null || true
          git commit -m "Amtsblatt- und Verzeichnis-Quellen aktualisiert" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 5; done
